<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Part 1 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdf7f0;--card:#fff;--ink:#1c1714;--ink-soft:#5a4f47;--ink-faint:#8a7d72;
  --orange:#ff5b35;--orange-deep:#d83c18;--orange-tint:#ffe9e1;
  --teal:#10806f;--teal-tint:#d8f0eb;--blue:#2b4a8b;--blue-tint:#dde6f7;
  --gold:#e0972a;--gold-tint:#fbeecd;--purple:#7a4ca0;--purple-tint:#ece0f6;
  --pink:#c23a78;--pink-tint:#fbe0ec;--line:#e9ddcf;
  --code-bg:#211c18;--code-ink:#f2e9df;
  --shadow:0 2px 0 rgba(28,23,20,.05),0 18px 40px -22px rgba(28,23,20,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1a1512;--card:#241d19;--ink:#f2e9df;--ink-soft:#c9bcb0;--ink-faint:#9a8c80;
  --orange-tint:#3a2219;--teal-tint:#14302b;--blue-tint:#1c2638;--gold-tint:#3a2e17;
  --purple-tint:#2c2236;--pink-tint:#371c29;--line:#3a302a;--code-bg:#120e0c;
}}
:root[data-theme="dark"]{
  --paper:#1a1512;--card:#241d19;--ink:#f2e9df;--ink-soft:#c9bcb0;--ink-faint:#9a8c80;
  --orange-tint:#3a2219;--teal-tint:#14302b;--blue-tint:#1c2638;--gold-tint:#3a2e17;
  --purple-tint:#2c2236;--pink-tint:#371c29;--line:#3a302a;--code-bg:#120e0c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Manrope,system-ui,sans-serif}
#progress{position:fixed;top:0;left:0;height:4px;background:var(--orange);width:0;transition:width .3s;z-index:10}
.wrap{max-width:820px;margin:0 auto;padding:48px 16px 96px}
.eyebrow{font:600 12px JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-deep)}
h1{font:800 clamp(34px,6vw,54px)/1.05 Fraunces,serif;margin:10px 0 14px}
.lede{color:var(--ink-soft);max-width:60ch}
.score{position:sticky;top:12px;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:28px 0;box-shadow:var(--shadow)}
.score b{font:800 22px Fraunces,serif;color:var(--orange)}
.mono{font-family:JetBrains Mono,monospace;font-size:13px}
button.reset{font:600 13px Manrope;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chap{font:600 22px Fraunces,serif;margin:44px 0 6px;display:flex;align-items:center;gap:10px}
.sec-num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--orange);color:#fff;font:700 15px JetBrains Mono}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.q h3{font:600 17px/1.45 Manrope;margin:0 0 12px}
.q h3 .n{font:600 12px JetBrains Mono;color:var(--ink-faint);display:block;margin-bottom:4px}
code{font:13px JetBrains Mono,monospace;background:var(--orange-tint);padding:1px 5px;border-radius:5px}
pre{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:14px;overflow-x:auto;font:13px/1.55 JetBrains Mono,monospace;margin:0 0 12px}
pre code{background:none;padding:0;color:inherit}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:15px/1.45 Manrope;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--orange)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--teal-tint);border-color:var(--teal)}
.opt.wrong{background:var(--pink-tint);border-color:var(--pink)}
.why{display:none;margin-top:12px;padding:12px 14px;border-left:4px solid var(--teal);background:var(--teal-tint);border-radius:0 10px 10px 0;font-size:14.5px}
.why.bad{border-color:var(--pink);background:var(--pink-tint)}
.q.done .why{display:block}
.final{display:none;text-align:center;background:var(--code-bg);color:var(--code-ink);border-radius:18px;padding:32px 20px;margin-top:40px}
.final h2{font:800 34px Fraunces,serif;margin:0 0 8px;color:var(--orange)}
</style>
</head>
<body>
<div id="progress"></div>
<main class="wrap">
  <div class="eyebrow">Part 1 · Chapters 0–4 · Check yourself</div>
  <h1>Quick quiz: the employees API so far</h1>
  <p class="lede">20 questions on the first five chapters, from the twelve-line server to paginated lists. Pick an answer to see why it's right. Nothing is saved, so refresh to start over.</p>
  <div class="score"><span><b id="sc">0</b> / <span id="tot">0</span> correct · <span class="mono" id="ans">0 answered</span></span><button class="reset" onclick="location.reload()">Restart</button></div>
  <div id="quiz"></div>
  <div class="final" id="final"><h2 id="fs"></h2><p id="fm"></p></div>
</main>
<script>
const Q = [
 {c:"0 · Hello, FastAPI", q:"In zsh, why does <code>pip install fastapi[standard]</code> fail?", o:["The <code>standard</code> extra doesn't exist","<code>[</code> and <code>]</code> are glob characters, so it needs quotes","pip needs <code>--extras standard</code>","You must activate the venv first"], a:1, w:"zsh treats square brackets as a glob and errors with <em>no matches found</em>. Write <code>pip install \"fastapi[standard]\"</code>."},
 {c:"0 · Hello, FastAPI", q:"After a <code>pip install</code>, what keeps <code>requirements.txt</code> in sync?", o:["pip updates it automatically, like package.json","Nothing: re-run <code>pip freeze &gt; requirements.txt</code>","uvicorn regenerates it on <code>--reload</code>","The venv writes it on deactivate"], a:1, w:"Python has no self-updating manifest. Re-freeze after every install, or the file quietly stops describing your environment."},
 {c:"0 · Hello, FastAPI", q:"What does <code>uvicorn app.main:app --reload</code> mean?", o:["Run the function <code>app</code> in <code>main.py</code> once","Import the object <code>app</code> from module <code>app.main</code>, serve it, and restart on file changes","Compile <code>app/main.py</code> and open /docs","Same as <code>app.listen()</code> with no file watching"], a:1, w:"uvicorn is the server and imports your FastAPI object. <code>--reload</code> plays the role of nodemon. There's no <code>listen()</code> call in your code."},
 {c:"0 · Hello, FastAPI", q:"Where do the <code>title</code>, <code>description</code> and <code>version</code> passed to <code>FastAPI(...)</code> end up?", o:["Only in the server logs","In <code>/openapi.json</code> and the /docs page","In response headers","Nowhere: they're comments"], a:1, w:"They flow into the OpenAPI spec, which matters later when that spec becomes the agent's tool schema."},
 {c:"1 · Reading data", q:"Given this handler, how does FastAPI treat <code>limit</code>?", code:"@app.get(\"/employees/{id}\")\nasync def get_one(id: int, limit: int = 20): ...", o:["As a path parameter","As an optional query parameter, validated as an int, defaulting to 20","As a required JSON body field","As a header"], a:1, w:"Names that appear in the path are path params. Other simple types are query params, and having a default makes one optional."},
 {c:"1 · Reading data", q:"What happens on <code>GET /employees/abc</code> when the parameter is <code>employee_id: int</code>?", o:["The handler runs and <code>employee_id</code> is <code>\"abc\"</code>","FastAPI returns 422 before your function runs","It returns 404","It returns 400 with <code>{\"error\": ...}</code>"], a:1, w:"The type hint is the validator. You get a 422 whose <code>detail</code> list holds <code>type: \"int_parsing\"</code> and <code>loc: [\"path\",\"employee_id\"]</code>."},
 {c:"1 · Reading data", q:"How does a FastAPI handler send a 404?", o:["<code>return res.status(404)</code>","<code>return 404, \"not found\"</code>","<code>raise HTTPException(status_code=404, detail=...)</code>","<code>abort(404)</code>"], a:2, w:"Raising ends the function at once, so you can't forget a <code>return</code> after the early exit. The body comes out as <code>{\"detail\": \"...\"}</code>."},
 {c:"1 · Reading data", q:"<code>role: Role | None = None</code> where <code>Role</code> is a <code>str, Enum</code>. What does <code>?role=intern</code> return?", o:["An empty list","Every employee","A 422 that lists the allowed values","A 500"], a:2, w:"Enums are validated too. The error shows the permitted values, and the same enum shows up in /docs and in the generated TS types."},
 {c:"2 · Writing data", q:"In Zod terms, a Pydantic <code>BaseModel</code> subclass is…", o:["Just the inferred TS type","The schema, the inferred type, and the OpenAPI doc in one declaration","Express middleware","An ORM table"], a:1, w:"One class does the parsing, the validation, the typing and the docs. Using it as a parameter type means there's no <code>.parse()</code> call to forget."},
 {c:"2 · Writing data", q:"Why are there two schemas, <code>EmployeeCreate</code> and <code>EmployeeRead</code>?", o:["Pydantic needs one per HTTP verb","Create accepts input (including salary); Read controls what's revealed (no salary)","Read is faster","Create is for the DB, Read is for the tests"], a:1, w:"Input and output are different contracts. <code>EmployeeRead</code> leaves out <code>salary</code>, so it is never sent."},
 {c:"2 · Writing data", q:"A handler returns a dict containing <code>salary</code>, with <code>response_model=EmployeeRead</code> set. What does the client get?", o:["Everything, salary included","The dict filtered to EmployeeRead's fields, so no salary","A 500, because extra keys aren't allowed","Only <code>id</code>"], a:1, w:"<code>response_model</code> filters the output, so the API fails closed: a new column is hidden until someone adds it to the Read schema on purpose."},
 {c:"2 · Writing data", q:"A body has a one-letter name <em>and</em> a negative salary. What does the 422 contain?", o:["Only the first error","Both errors in the <code>detail</code> list, each with <code>loc</code>, <code>type</code>, <code>msg</code>","A single string message","A 400 instead"], a:1, w:"Every failure is reported at once. A React form can map <code>loc[1]</code> to an input and show <code>msg</code> under it."},
 {c:"2 · Writing data", q:"What does <code>Field(ge=0)</code> mean?", o:["Greater than 0","Greater than or equal to 0","Generated, with a default of 0","Global, starting at 0"], a:1, w:"<code>ge</code> means greater-or-equal, like Zod's <code>.min(0)</code>. There are also <code>gt</code>, <code>le</code> and <code>lt</code>."},
 {c:"3 · The database", q:"Which analogy fits SQLAlchemy's pieces?", o:["Engine = one query; session = the whole DB","Engine = connection pool; session = one unit of work per request","Engine = ORM model; session = table","Engine = uvicorn; session = cookie"], a:1, w:"<code>create_async_engine</code> gives you the pool. <code>async_sessionmaker</code> creates one session per request, roughly a transaction scope."},
 {c:"3 · The database", q:"In <code>get_db</code>, when does the code after <code>yield session</code> run?", code:"async def get_db():\n    async with SessionLocal() as session:\n        yield session", o:["Before the handler","After the response, even if the handler raised","Only if the handler succeeds","Never"], a:1, w:"Code before <code>yield</code> is setup and code after it is teardown. <code>Depends(get_db)</code> injects a typed session only into routes that ask for one, so there's no <code>req.db</code> declaration merging."},
 {c:"3 · The database", q:"Why does PATCH use <code>payload.model_dump(exclude_unset=True)</code>?", o:["It's faster","It tells \"field not sent\" apart from \"field sent as null\"","It strips salary","It's required by SQLite"], a:1, w:"Every field on <code>EmployeeUpdate</code> defaults to None. Without the flag, an omitted <code>department_id</code> would wipe the value. With it, omitted means untouched and an explicit <code>null</code> means clear."},
 {c:"3 · The database", q:"Which line freezes every in-flight request inside an <code>async def</code> handler?", o:["<code>await db.scalars(stmt)</code>","<code>requests.get(url)</code>","<code>await client.get(url)</code> with httpx.AsyncClient","<code>return {\"ok\": True}</code>"], a:1, w:"<code>requests</code> blocks the event loop, just like <code>fs.readFileSync</code> in Express. Use the async versions instead: httpx.AsyncClient and aiosqlite."},
 {c:"4 · Lists a frontend can use", q:"Why wrap lists in <code>Page[T]</code> instead of returning a bare array?", o:["JSON can't serialise top-level arrays","So the client gets <code>total</code> for the pager, and you can add fields later without breaking clients","SQLAlchemy requires it","It's faster to serialise"], a:1, w:"<code>{items, total, limit, offset}</code> is one envelope reused everywhere. <code>total</code> counts the rows matching the filters, ignoring limit and offset."},
 {c:"4 · Lists a frontend can use", q:"What does <code>sort_by: Literal[\"name\",\"date_joined\",\"salary\"]</code> buy you?", o:["Nothing at runtime","Any other value gets a 422, so clients can't sort on (or probe) columns you didn't list, and it becomes an OpenAPI enum","It sorts automatically","It makes the field required"], a:1, w:"It's a union of string literals, as in TS, but enforced at runtime. Pair it with <code>Query(ge=1, le=100)</code> to keep page sizes safe."},
 {c:"4 · Lists a frontend can use", q:"<code>Filters = Annotated[EmployeeFilters, Depends()]</code>. What does FastAPI do with the class?", o:["Reads its <code>__init__</code> parameters as query params, builds an instance per request, and caches dependencies within that request","Treats it as the JSON body","Creates it once at startup","Ignores it unless it subclasses BaseModel"], a:0, w:"A class with a typed <code>__init__</code> works as a reusable bundle of query params. Dependencies form a graph, and a shared one like <code>get_db</code> runs once per request."},
];
const box=document.getElementById('quiz');let score=0,done=0,last='';
document.getElementById('tot').textContent=Q.length;
Q.forEach((x,i)=>{
  if(x.c!==last){last=x.c;const h=document.createElement('div');h.className='chap';
    h.innerHTML=`<span class="sec-num">${x.c[0]}</span>${x.c.split('· ')[1]}`;box.appendChild(h);}
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`<h3><span class="n">Q${i+1}</span>${x.q}</h3>${x.code?`<pre><code>${x.code.replace(/</g,'&lt;')}</code></pre>`:''}<div class="opts">${x.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div class="why"></div>`;
  d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j,ok=j===x.a;
    d.querySelectorAll('.opt').forEach((bb,k)=>{bb.disabled=true;if(k===x.a)bb.classList.add('right');});
    if(!ok)b.classList.add('wrong');
    const w=d.querySelector('.why');w.innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+x.w;if(!ok)w.classList.add('bad');
    d.classList.add('done');score+=ok;done++;
    document.getElementById('sc').textContent=score;
    document.getElementById('ans').textContent=done+' answered';
    document.getElementById('progress').style.width=(done/Q.length*100)+'%';
    if(done===Q.length){const f=document.getElementById('final');f.style.display='block';
      document.getElementById('fs').textContent=`${score} / ${Q.length}`;
      document.getElementById('fm').textContent=score>=17?'Solid. You\'re ready for Chapter 5.':score>=12?'Good. Re-skim the chapters you missed before the refactor.':'Worth another pass through chapters 2–4 before moving on.';
      f.scrollIntoView({behavior:'smooth'});}
  });
  box.appendChild(d);
});
</script>
</body>
</html>
